name: Sync Upstream Template

# Runs in every app repository created from the template: pulls the template's
# latest commits and opens a PR with them.
#
# Nothing to configure in the app repo. The token is minted by the org-shared
# action nitrox-tech/github-app-token, which holds the "Template Sync Bot"
# GitHub App key. One-time org setup: see TEMPLATE_SYNC_SETUP.md
#
# The sync PR is a plain git merge of the template branch, so the app repo must
# share history with the template (created by cloning, not "Use this template").

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  TEMPLATE_SOURCE_REPO: nitrox-tech/core-template-android
  TEMPLATE_SOURCE_BRANCH: main

jobs:
  sync:
    # The template must never sync from itself. Keep this in step with `env`
    # above: a job-level `if` cannot read the env context.
    if: github.repository != 'nitrox-tech/core-template-android'
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN cannot be used here: it has no access to the template repo,
      # it can never get the `workflows` permission needed to push changes under
      # .github/workflows, and a PR it opens would not trigger CI.
      - name: Generate token to read from source repo
        id: generate_token
        uses: nitrox-tech/github-app-token@v1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0

      # source_gh_token reads the template; target_gh_token pushes the sync branch
      # and opens the PR here. Both must be the App token (target_gh_token defaults
      # to GITHUB_TOKEN, whose PRs do not trigger workflows).
      - name: Fetch upstream changes
        uses: AndreasAugustin/actions-template-sync@v2
        id: pre-check
        with:
          source_gh_token: ${{ steps.generate_token.outputs.token }}
          target_gh_token: ${{ steps.generate_token.outputs.token }}
          source_repo_path: ${{ env.TEMPLATE_SOURCE_REPO }}
          upstream_branch: ${{ env.TEMPLATE_SOURCE_BRANCH }}
          pr_labels: template_sync
          steps: "prechecks,pull"

      # The pull step leaves a staged merge; resetting to FETCH_HEAD makes the sync
      # branch match upstream exactly instead of carrying a merge commit.
      - name: Reset to fetched upstream state
        run: |
          echo "branch: ${{ steps.pre-check.outputs.pr_branch }}"
          git reset --hard FETCH_HEAD

      # continue-on-error: "nothing to sync" exits non-zero, which is the normal
      # outcome on most days and should not surface as a failed workflow.
      - name: Push sync branch and open PR
        uses: AndreasAugustin/actions-template-sync@v2
        continue-on-error: true
        with:
          source_gh_token: ${{ steps.generate_token.outputs.token }}
          target_gh_token: ${{ steps.generate_token.outputs.token }}
          source_repo_path: ${{ env.TEMPLATE_SOURCE_REPO }}
          upstream_branch: ${{ env.TEMPLATE_SOURCE_BRANCH }}
          pr_labels: template_sync
          steps: "push,pr"
